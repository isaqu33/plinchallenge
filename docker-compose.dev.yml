name: plin_challenge

services:
  web:
    container_name: plin-web-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${WEB_PORT_HOST:-3100}:3100"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
